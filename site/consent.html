<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f4f4">
  <title>Connect your agent — Serena Launch</title>
  <link rel="icon" href="/launchvideo/favicon.svg?v=popcorn-1" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="consent.css">
  <script src="consent.js" type="module"></script>
</head>
<body class="consent-page">
  <main class="consent-card" aria-labelledby="consent-heading">
    <div class="consent-brand"><img src="favicon.svg" width="26" height="26" alt=""><span>Serena Launch</span></div>
    <p id="consent-status" role="status">Loading…</p>
    <section id="consent-content" hidden>
      <div class="consent-logos" aria-hidden="true"><img id="client-logo" width="42" height="42" alt="" hidden><span id="client-initial" hidden></span><span class="consent-arrow">↔</span><img src="mascot/serena-popcorn.png" width="62" height="62" alt=""></div>
      <h1 id="consent-heading">Connect your agent</h1>
      <p class="consent-account" id="consent-account"></p>
      <form id="consent-form" method="POST">
        <div class="consent-permissions"><h2>Requested access</h2><ul id="consent-scopes"></ul></div>
        <div id="consent-organization" hidden><label for="organization-id">Organization</label><select id="organization-id" name="organization_id" disabled></select></div>
        <div class="consent-trust">
          <p id="consent-trust-summary"></p>
          <p class="consent-return">Return to <strong id="consent-return"></strong></p>
          <details id="consent-details"><summary>Details</summary><div class="consent-explanation"><dl><dt>Website</dt><dd id="consent-app-url"></dd><dt>Client ID</dt><dd id="consent-client-id"></dd><dt>Return URL</dt><dd id="consent-redirect-uri"></dd></dl></div></details>
        </div>
        <div class="consent-actions"><button type="submit" name="consented" value="false" formnovalidate>Deny</button><button type="submit" name="consented" value="true">Allow</button></div>
        <p class="consent-account" id="consent-submit-status" role="status" hidden></p>
      </form>
      <p class="consent-footer">Secured by Clerk</p>
    </section>
    <noscript><p>Enable JavaScript to review this connection.</p></noscript>
  </main>
</body>
</html>
